version: 2

models:
  - name: dim_artists
    description: "Dimension table. One row per artist. Grain: artist_id."
    columns:
      - name: artist_id
        description: "Primary key. Unique identifier for each artist."
        data_tests:
          - unique
          - not_null
      - name: artist_name
        description: "Name of the artist. Nullable in source."
